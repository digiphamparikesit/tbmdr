name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# WAJIB DITAMBAHKAN: Izin untuk menulis ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# WAJIB DITAMBAHKAN: Mencegah bentrok jika push bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Generate config.js
        run: |
          cat > config.js <<EOF
          window.TBMDR_CONFIG = {
            API_URL:    "${{ secrets.TBMDR_API_URL }}",
            SECRET_KEY: "${{ secrets.TBMDR_SECRET_KEY }}"
          };
          EOF
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # WAJIB DITAMBAHKAN: Job untuk men-deploy hasil build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
