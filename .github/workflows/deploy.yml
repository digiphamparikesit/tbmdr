name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Generate config.js safely
        env:
          API_URL: ${{ secrets.TBMDR_API_URL }}
          SECRET_KEY: ${{ secrets.TBMDR_SECRET_KEY }}
        run: |
          jq -n --arg url "$API_URL" --arg key "$SECRET_KEY" \
            '{window: {TBMDR_CONFIG: {API_URL: $url, SECRET_KEY: $key}}}' > config.js

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
