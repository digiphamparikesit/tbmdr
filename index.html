<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Surat TBMDR</title>
<style>
  :root { --primary:#1a73e8; --bg:#f5f7fb; --border:#dadce0; --text:#202124; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .container { max-width:820px; margin:32px auto; background:#fff; border-radius:12px;
               box-shadow:0 2px 12px rgba(0,0,0,.08); padding:32px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#5f6368; font-size:14px; margin-bottom:24px; }
  fieldset { border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:20px; }
  legend { font-weight:600; padding:0 6px; color:var(--primary); }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--border);
                  border-radius:6px; font-size:14px; outline:none; }
  input:focus, select:focus { border-color:var(--primary); }
  .grid { display:grid; gap:12px; grid-template-columns:1fr 1fr; }
  .grid-3 { display:grid; gap:12px; grid-template-columns:2fr 1fr 1fr; }
  .obat-row { display:grid; grid-template-columns:1fr 120px 36px; gap:8px;
              align-items:center; margin-bottom:8px; }
  .btn-del { background:#fce8e6; color:#c5221f; border:none; border-radius:6px;
             height:38px; cursor:pointer; font-weight:700; }
  .btn-add { background:#e8f0fe; color:var(--primary); border:none; border-radius:6px;
             padding:10px 16px; cursor:pointer; font-weight:600; margin-top:4px; }
  .submit { width:100%; background:var(--primary); color:#fff; border:none;
            padding:14px; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; }
  .submit:disabled { opacity:.6; cursor:not-allowed; }
  .msg { padding:12px; border-radius:6px; margin-top:16px; font-size:14px; display:none; }
  .msg.ok  { background:#e6f4ea; color:#137333; display:block; }
  .msg.err { background:#fce8e6; color:#c5221f; display:block; }
  @media (max-width:600px){ .grid,.grid-3 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1>Form Surat TBMDR</h1>
  <p class="sub">Isi data pasien dan paket obat TB MDR.</p>

  <form id="formTbmdr">
    <fieldset>
      <legend>Data Surat</legend>
      <div class="grid-3">
        <div><label>Nomor Surat</label><input type="text" name="nomor_surat" required placeholder="mis. 314"></div>
        <div>
          <label>Bulan (Romawi)</label>
          <select name="bulan" required>
            <option value="">-- pilih --</option>
            <option>I</option><option>II</option><option>III</option><option>IV</option>
            <option>V</option><option>VI</option><option>VII</option><option>VIII</option>
            <option>IX</option><option>X</option><option>XI</option><option>XII</option>
          </select>
        </div>
        <div><label>Tahun</label><input type="number" name="tahun" required min="2023" max="2100" value="2026"></div>
      </div>
      <div style="margin-top:12px;">
        <label>Jumlah Paket Obat</label>
        <select name="jumlah_paket" id="jumlahPaket" required>
          <option value="">-- pilih --</option>
          <option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Data Pasien</legend>
      <div class="grid">
        <div><label>Nama Pasien</label><input type="text" name="nama_pasien" required></div>
        <div><label>Nama Puskesmas</label><input type="text" name="nama_puskesmas" required></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Daftar Obat</legend>
      <div id="obatContainer"></div>
      <button type="button" class="btn-add" id="btnAdd">+ Tambah Obat</button>
      <p class="sub" style="margin:8px 0 0;font-size:12px;">
        Isi nama obat &amp; jumlah. Jumlah baris otomatis mengikuti "Jumlah Paket Obat".
      </p>
    </fieldset>

    <button type="submit" class="submit" id="btnSubmit">Kirim &amp; Buat PDF</button>
    <div id="msg" class="msg"></div>
  </form>
</div>

<!-- Konfigurasi dipisah dari HTML -->
<script src="config.js"></script>
<script>
// ============================================================
// AMBIL KONFIGURASI (dari config.js)
// ============================================================
const CFG = window.TBMDR_CONFIG || {};
if (!CFG.API_URL || CFG.API_URL.includes('GANTI_DEPLOYMENT_ID')) {
  document.body.innerHTML =
    '<div style="max-width:600px;margin:80px auto;padding:24px;background:#fce8e6;' +
    'color:#c5221f;border-radius:8px;font-family:sans-serif;">' +
    '<b>Konfigurasi belum diisi.</b><br>' +
    'Salin <code>config.example.js</code> menjadi <code>config.js</code> dan isi ' +
    '<code>API_URL</code> serta <code>SECRET_KEY</code>.</div>';
  throw new Error('Config missing');
}

const API_URL    = CFG.API_URL;
const SECRET_KEY = CFG.SECRET_KEY;

const container      = document.getElementById('obatContainer');
const jumlahPaketSel = document.getElementById('jumlahPaket');

function buatBarisObat(nama = '', jumlah = '') {
  const row = document.createElement('div');
  row.className = 'obat-row';
  row.innerHTML = `
    <input type="text"   class="obat-nama"   placeholder="Nama obat" value="${nama}">
    <input type="number" class="obat-jumlah" placeholder="Jumlah" value="${jumlah}" min="0" step="any">
    <button type="button" class="btn-del" title="Hapus">&times;</button>
  `;
  row.querySelector('.btn-del').onclick = () => { row.remove(); renumber(); };
  container.appendChild(row);
  renumber();
}

function renumber() {
  [...container.children].forEach((row, i) => {
    row.querySelector('.obat-nama').placeholder = 'Nama obat ke-' + (i+1);
  });
}

jumlahPaketSel.addEventListener('change', () => {
  const n = parseInt(jumlahPaketSel.value, 10);
  if (!n) return;
  while (container.children.length < n) buatBarisObat();
  while (container.children.length > n) container.lastElementChild.remove();
  renumber();
});

document.getElementById('btnAdd').onclick = () => {
  if (container.children.length >= 10) return alert('Maksimal 10 obat.');
  buatBarisObat();
};

buatBarisObat(); buatBarisObat();

document.getElementById('formTbmdr').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnSubmit');
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = '';

  const data = Object.fromEntries(new FormData(e.target).entries());

  const obat = [...container.children].map(row => ({
    nama:   row.querySelector('.obat-nama').value.trim(),
    jumlah: row.querySelector('.obat-jumlah').value.trim()
  })).filter(o => o.nama || o.jumlah);

  if (obat.length === 0) {
    msg.className = 'msg err'; msg.textContent = 'Isi minimal 1 obat.'; return;
  }
  const jumlahPaket = parseInt(data.jumlah_paket, 10);
  if (obat.length !== jumlahPaket) {
    msg.className = 'msg err';
    msg.textContent = `Jumlah obat diisi ${obat.length}, tetapi paket dipilih ${jumlahPaket}.`;
    return;
  }

  data.obat   = obat;
  data.secret = SECRET_KEY;

  btn.disabled = true; btn.textContent = 'Mengirim...';

  try {
    const res  = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    });
    const json = await res.json();

    if (json.success) {
      msg.className = 'msg ok';
      msg.innerHTML = `✅ Tersimpan di <b>${json.sheet}</b> baris ${json.row}.` +
        (json.pdf_url ? `<br><a href="${json.pdf_url}" target="_blank">Buka PDF</a>` : '');
      e.target.reset();
      container.innerHTML = ''; buatBarisObat(); buatBarisObat();
    } else {
      throw new Error(json.error || 'Gagal');
    }
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Kirim & Buat PDF';
  }
});
</script>
</body>
</html>
